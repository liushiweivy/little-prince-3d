<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小王子 · B612 漫游原型</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌹</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="hud">
    <h1 id="planet-name">小王子 <span>·</span> B-612 小行星</h1>
    <p class="hint">左键拖拽转视角　滚轮缩放　右键点地自动前往　WASD 行走（相对视角方向）　Space 跳　E 交谈 / 星图</p>
    <p class="hint dim" id="sub-hint">走近角色按 E 交谈；到金色出发台按 E 启程拜访沿途六颗小行星</p>
  </div>

  <div id="pad-prompt" class="hidden">按 <b>E</b> 打开星图出发</div>

  <div id="dialogue" class="hidden">
    <div class="dialogue-card">
      <div id="dialogue-speaker" class="speaker"></div>
      <p id="dialogue-text"></p>
      <div id="dialogue-next">E / 点击 继续 ▾</div>
    </div>
  </div>

  <div id="starmap" class="hidden">
    <div class="starmap-card">
      <h2>星图</h2>
      <p class="starmap-sub">选择一颗行星启程（鸟群会替你迁徙）</p>
      <div id="starmap-list"></div>
      <p class="starmap-close">Esc 关闭</p>
    </div>
  </div>

  <div id="fade"></div>

  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.min.js"}}
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
