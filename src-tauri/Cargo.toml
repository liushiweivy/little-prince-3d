[package]
name = "little-prince"
version = "1.0.0"
description = "小王子：星辰之旅"
authors = ["b612"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "little_prince_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
